<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p>Parrafo 1</p>
    <p>Parrafo 2</p>

    <button id="btnCambiar">Cambiar</button>
    <script>
      //Cogemos el elemento del DOM por la etiqueta "p"
      let parrafos = document.getElementsByTagName("p");
      //Configuramos el Manejador de eventos por un click en el btnCambiar
      let btnCambiarElemento = addEventListener("click", function () {
        //Recorremos los elementos y los pintamos de color verde
        for (let p of parrafos) {
          p.style.color = "green";
        }
      });
    </script>
  </body>
</html>
