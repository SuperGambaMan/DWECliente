<!-- Práctica 7.2: Salto a Google en 5 segundos
• Muestra una página que diga Nos vamos y que tras cinco segundos nos redirija a la página
del buscador Google. -->

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Práctica 7.2: Salto a Google en 5 segundos</title>
  </head>
  <body>
    <p>Nos vamos</p>
  </body>
  <script>
    // Retrasamos 5 segundos la apertura del enlace
    setTimeout(() => {
      location = "https://www.google.es";
    }, 5000);
  </script>
</html>
