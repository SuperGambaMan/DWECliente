<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="navegador"></p>
    
    <script>

        Version: ${navigator.appVersion}`;
    </script>

</body>
