<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p class="destacar">Parrafo 1</p>
    <p class="destacar">Parrafo 2</p>

    <button id="btnCambiar">Cambiar</button>
    <script>
      //Cogemos el elemento del DOM por la clase "destacar"
      let clases = document.getElementsByClassName("destacar");
      //Configuramos el Manejador de eventos por un click en el btnCambiar
      let btnCambiarElemento = addEventListener("click", function () {
        //recorremos con ForOf todos los elementos y los subrayamos amarillo
        for (let p of clases) {
          p.style.backgroundColor = "yellow";
        }
      });
    </script>
  </body>
</html>
