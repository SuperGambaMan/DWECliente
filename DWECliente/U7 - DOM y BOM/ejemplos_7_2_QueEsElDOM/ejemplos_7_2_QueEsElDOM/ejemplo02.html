<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="contenedor"></div>
    <button type="button" id="btnCambiar">Cambiar</button>
    <script>
        let nuevoDiv = document.createElement("div");
        //Elemento del DOM
        let btnCambiarElemento = document.getElementById("btnCambiar");

        //asigno manejador de enveto
        btnCambiarElemento.addEventListener("click", function(){
            
            //obtener la referencia al elemento DOM
            nuevoDiv.textContent = "Soy un div creado dinámicamente";
        
            document.getElementById("contenedor").appendChild(nuevoDiv);
        });
        
    </script>

</body>
</html>
