<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Tareas</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- FontAwesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<!-- Estilos personalizados -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-4">Mi Lista de Tareas</h1>

    <!-- Información del navegador usando BOM -->
    <div class="alert alert-info text-center" id="infoNavegador"></div>

    <!-- Input para nueva tarea -->
    <div class="input-group mb-3">
        <input type="text" id="nuevaTarea" class="form-control" placeholder="Escribe una nueva tarea">
        <button class="btn btn-primary" id="agregarTarea">
            <i class="fas fa-plus"></i> Agregar
        </button>
    </div>

    <!-- Lista de tareas -->
    <ul class="list-group" id="listaTareas"></ul>
</div>

<!-- Script principal -->
<script src="js/app.js"></script>
</body>
</html>
