<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 
    Ejercicio 5: Selección con querySelectorAll
    Enunciado: Selecciona tod os los párrafos dentro de un div con clase contenedor y ponlos en negrita.

    -->
    <div class="contenedor">
      <p>P1</p>
      <p>P2</p>
    </div>

    <script>
      let contenedor = document.querySelectorAll(".contenedor");

      contenedor.forEach((p) => (p.style.fontWeight = "bold"));
    </script>
  </body>
</html>
