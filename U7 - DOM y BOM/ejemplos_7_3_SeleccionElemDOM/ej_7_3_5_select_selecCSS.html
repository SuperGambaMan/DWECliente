<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="tarjeta">Tarjeta 1</div>
    <div class="tarjeta">Tarjeta 2</div>
    
    <button id="btnCambiar">Cambiar</button>
    <script>
        //Cogemos el elemento del DOM por objeto ".tarjeta"
        //Selecciona el primero
        let primera = document.querySelector(".tarjeta");
        // Selecciona todos
        let todas = document.querySelectorAll(".tarjeta");
//Configuramos el Manejador de eventos por un click en el btnCambiar
        let btnCambiarElemento = addEventListener("click", function () {
            //Al primero le pondra bordes rojos y a todos el padding
            primera.style.border = "2px solid red";
            todas.forEach(d => d.style.padding = "10px");
        });
    </script>

</body>
</html>
