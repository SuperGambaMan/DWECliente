<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p class="resaltar">Parrafo 1</p>
    <p class="resaltar">Parrafo 2</p>

    <button id="btnCambiar">Cambiar</button>
    <script>
      //Cogemos el elemento del DOM por el objeto ".resaltar"
      let nodos = document.querySelectorAll(".resaltar");
      //Configuramos el Manejador de eventos por un click en el btnCambiar
      let btnCambiarElemento = addEventListener("click", function () {
        //Recorremos con forEach topos los elementos y los ponemos en negrita
        nodos.forEach((n) => (n.style.fontWeight = "bold"));
      });
    </script>
  </body>
</html>
