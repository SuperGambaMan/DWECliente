<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Información de pantalla</h2>
    <p id="pantalla"></p>
    <script>
      let pantalla = document.getElementById("pantalla");
      pantalla.innerHTML = `
        Ancho: ${screen.width}px <br>
        Alto: ${screen.height}px <br>
        Color: ${screen.colorDepth} bits
        `;
    </script>
  </body>
</html>
