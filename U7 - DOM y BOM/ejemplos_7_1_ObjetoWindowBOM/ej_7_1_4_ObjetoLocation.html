<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>URL actual</h2>
    <p id="urlActual"></p>
    <button id="redirigir">Ir a OpenAI</button>
    <script>
        let urlActual = document.getElementById("urlActual");
        urlActual.textContent = "URL actual: " + window.location.href;

        document.getElementById("redirigir").onclick = () => {
            window.location.href = "https://www.openai.com";
        };
    </script>

</body>
</html>
