<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Evento Cerrar la ventana - Pide Confirmacion</h1>
    <script>
        window.onbeforeunload = (e) => {
            var respuesta = window.confirm("¿Desea salir realmente de la aplicación?");
            //Si el usuario pulsa Aceptar, el valor de 'respuesta' será true
            if(respuesta){
                window.alert("Gracias por visitarnos."); // Se ejecuta si el usuario confima
            } else {
                window.alert("Se ha cancelado la acción."); // Se ejecuta si el usuario cancela
            }
        };
    </script>

</body>
</html>
