<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Navigator</title>
  </head>
  <body>
    <h2>Información del navegador</h2>
    <p id="info"></p>
    <script>
      let info = document.getElementById("info");
      info.innerHTML = `
Navegador: ${navigator.appName} <br>
Versión: ${navigator.appVersion} <br>
Plataforma: ${navigator.platform}
`;
    </script>
  </body>
</html>
