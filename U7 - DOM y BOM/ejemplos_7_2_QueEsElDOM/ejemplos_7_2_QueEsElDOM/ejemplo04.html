<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="estilo">Este párrafo cambiará de color</p>
    <button type="button" id="btnCambiar">Cambiar</button>
    <script>
        
        let p = document.getElementById("estilo");
        
         //Elemento del DOM
        let btnCambiarElemento = document.getElementById("btnCambiar");

        //asigno manejador de enveto
        btnCambiarElemento.addEventListener("click", function(){
            
            //obtener la referencia al elemento DOM
            p.style.color = "red";
            p.style.fontWeight = "bold";
        });

    </script>

</body>
</html>
