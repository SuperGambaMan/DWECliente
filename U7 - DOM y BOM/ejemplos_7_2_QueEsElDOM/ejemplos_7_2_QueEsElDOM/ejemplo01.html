<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="miParrafo">Hola, soy un párrafo.</p>
    <button type="button" id="btnCambiar">Cambiar</button>
    <script>
        
        let miParrafo = document.getElementById("miParrafo");
        
        //p.textContent = "¡Texto modificado con JavaScript!";

        //Elemento del DOM
        let btnCambiarElemento = document.getElementById("btnCambiar");

        //asigno manejador de enveto
        btnCambiarElemento.addEventListener("click", function(){
            
            //obtener la referencia al elemento DOM
            miParrafo.textContent = "¡Texto modificado con JavaScript!";
        });
    </script>

</body>
</html>
