<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    Ejercicio 1: Modificar texto de un párrafo
    Enunciado: Cambia el contenido del párrafo con id mensaje a “Hola Mundo”.

    -->

    <p id="mensaje">Texto original</p>
    <button id="btnCambiar">Cambiar</button>
    <script>
        let p = document.getElementById("mensaje");

        let btnCambiarElemento = document.getElementById("btnCambiar");
        btnCambiarElemento.addEventListener("click", function () {
           p.textContent = "Mi pitiiiiiiii";
        });
    </script>


</body>
</html>
